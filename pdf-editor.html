<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --surface: #0f3460;
    --accent: #e94560;
    --accent2: #533483;
    --text: #eaeaea;
    --muted: #8892a4;
    --border: rgba(255,255,255,0.08);
    --hover: rgba(233,69,96,0.12);
    --radius: 8px;
    --toolbar-w: 260px;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* === TOP BAR === */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    height: 52px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 100;
  }

  .logo {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
    white-space: nowrap;
  }

  #topbar .sep { flex: 1; }

  #page-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  #page-nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #page-nav button:hover { background: var(--hover); }
  #page-nav button:disabled { opacity: 0.3; cursor: default; }

  .topbtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .topbtn:hover { background: var(--hover); border-color: var(--accent); }
  .topbtn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .topbtn.primary:hover { background: #c73553; }

  /* === LAYOUT === */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* === SIDEBAR === */
  #sidebar {
    width: var(--toolbar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .tool-section {
    padding: 14px 14px 8px;
    border-bottom: 1px solid var(--border);
  }

  .tool-section h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .tool-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    transition: background 0.15s, border-color 0.15s;
    text-align: left;
  }
  .tool-btn:hover { background: var(--hover); border-color: rgba(233,69,96,0.4); }
  .tool-btn.active {
    background: rgba(233,69,96,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  .tool-icon { font-size: 16px; width: 18px; text-align: center; }

  .form-row {
    margin-bottom: 10px;
  }
  .form-row label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .form-row input[type=text],
  .form-row input[type=number],
  .form-row select,
  .form-row textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-row textarea { min-height: 70px; resize: vertical; font-family: inherit; }
  .form-row input:focus,
  .form-row select:focus,
  .form-row textarea:focus { border-color: var(--accent); }

  .form-row input[type=color] {
    width: 36px;
    height: 28px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }

  .form-inline {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .add-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 8px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    margin-top: 6px;
    transition: background 0.15s;
  }
  .add-btn:hover { background: #c73553; }
  .add-btn:disabled { background: #555; cursor: default; }

  /* === CANVAS AREA === */
  #canvas-area {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
    background: #111827;
  }

  #editor-container {
    position: relative;
    display: inline-block;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }

  #pdf-canvas {
    display: block;
  }

  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* === ELEMENTS OVERLAY === */
  .el {
    position: absolute;
    cursor: move;
    pointer-events: all;
    user-select: none;
  }

  .el.selected .el-border {
    outline: 2px solid var(--accent);
  }

  .el-border {
    position: absolute;
    inset: 0;
    outline: 1px dashed rgba(255,255,255,0.3);
  }

  .el.selected .el-border { outline: 2px solid var(--accent); }

  /* Resize handles */
  .handle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border: 2px solid #fff;
    border-radius: 2px;
    display: none;
  }
  .el.selected .handle { display: block; }

  .handle.nw { top: -5px; left: -5px; cursor: nw-resize; }
  .handle.ne { top: -5px; right: -5px; cursor: ne-resize; }
  .handle.sw { bottom: -5px; left: -5px; cursor: sw-resize; }
  .handle.se { bottom: -5px; right: -5px; cursor: se-resize; }
  .handle.n  { top: -5px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
  .handle.s  { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
  .handle.w  { top: 50%; left: -5px; transform: translateY(-50%); cursor: w-resize; }
  .handle.e  { top: 50%; right: -5px; transform: translateY(-50%); cursor: e-resize; }

  /* Delete button on element */
  .el-del {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 22px;
    height: 22px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    font-weight: 700;
  }
  .el.selected .el-del { display: flex; }

  /* Text element */
  .el-text-inner {
    width: 100%;
    height: 100%;
    overflow: hidden;
    word-break: break-word;
    line-height: 1.4;
  }

  /* Image element */
  .el-img-inner {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }

  /* === EMPTY STATE === */
  #empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 14px;
    pointer-events: none;
  }

  #empty-state .big-icon { font-size: 56px; opacity: 0.3; }
  #empty-state p { font-size: 15px; opacity: 0.7; text-align: center; }

  /* === DROP ZONE === */
  #drop-zone {
    position: fixed;
    inset: 0;
    background: rgba(233,69,96,0.15);
    border: 3px dashed var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 20px;
    font-weight: 700;
    z-index: 9999;
    pointer-events: none;
  }
  #drop-zone.active { display: flex; }

  /* === STATUS BAR === */
  #statusbar {
    height: 26px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 16px;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }

  #statusbar span { display: flex; align-items: center; gap: 4px; }

  /* === MODAL === */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 340px;
    max-width: 90vw;
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }

  /* === RESPONSIVE === */
  @media (max-width: 640px) {
    :root { --toolbar-w: 100%; }
    #main { flex-direction: column; }
    #sidebar {
      width: 100%;
      height: auto;
      max-height: 200px;
      border-right: none;
      border-bottom: 1px solid var(--border);
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .tool-section {
      min-width: 200px;
      border-bottom: none;
      border-right: 1px solid var(--border);
    }
    #canvas-area { padding: 12px; }
    .logo { font-size: 14px; }
  }

  /* file input hidden */
  #file-input, #img-input { display: none; }
</style>
</head>
<body>

<!-- Hidden inputs -->
<input type="file" id="file-input" accept=".pdf">
<input type="file" id="img-input" accept="image/*">

<!-- Top bar -->
<div id="topbar">
  <span class="logo">✏️ PDF Editor</span>
  <button class="topbtn" onclick="document.getElementById('file-input').click()">
    📂 Ouvrir PDF
  </button>
  <div id="page-nav" style="display:none">
    <button id="prev-page" onclick="changePage(-1)">‹</button>
    <span>Page <strong id="cur-page">1</strong> / <span id="total-pages">1</span></span>
    <button id="next-page" onclick="changePage(1)">›</button>
  </div>
  <div class="sep"></div>
  <button class="topbtn" onclick="openZoomModal()">🔍 <span id="zoom-label">100%</span></button>
  <button class="topbtn" id="undo-btn" onclick="undo()" title="Annuler" disabled>↩ Annuler</button>
  <button class="topbtn primary" id="save-btn" onclick="exportPDF()" disabled>💾 Enregistrer PDF</button>
</div>

<!-- Main -->
<div id="main">

  <!-- Sidebar -->
  <div id="sidebar">

    <!-- Ajouter texte -->
    <div class="tool-section">
      <h3>Ajouter du texte</h3>
      <div class="form-row">
        <label>Contenu</label>
        <textarea id="txt-content" placeholder="Votre texte ici..."></textarea>
      </div>
      <div class="form-row">
        <label>Taille</label>
        <input type="number" id="txt-size" value="16" min="6" max="120" style="width:80px">
      </div>
      <div class="form-row">
        <label>Couleur</label>
        <input type="color" id="txt-color" value="#000000">
      </div>
      <div class="form-row">
        <label>Police</label>
        <select id="txt-font">
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="'Courier New', monospace">Courier New</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="Verdana, sans-serif">Verdana</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-inline">
          <label style="margin:0">Gras</label>
          <input type="checkbox" id="txt-bold">
          <label style="margin:0 0 0 12px">Italique</label>
          <input type="checkbox" id="txt-italic">
        </div>
      </div>
      <div class="form-row">
        <label>Fond du bloc texte</label>
        <div style="display:flex;gap:8px;margin-top:2px">
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:var(--text)">
            <input type="radio" name="txt-bg" id="txt-bg-transparent" value="transparent" checked style="accent-color:var(--accent)">
            Transparent
          </label>
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:var(--text)">
            <input type="radio" name="txt-bg" id="txt-bg-white" value="white" style="accent-color:var(--accent)">
            Blanc opaque
          </label>
        </div>
      </div>
      <button class="add-btn" id="btn-add-text" onclick="addText()" disabled>+ Ajouter texte</button>
    </div>

    <!-- Ajouter image -->
    <div class="tool-section">
      <h3>Ajouter une image</h3>
      <button class="tool-btn" onclick="document.getElementById('img-input').click()">
        <span class="tool-icon">🖼️</span> Choisir une image
      </button>
      <div class="form-row" style="margin-top:8px">
        <label>Fond de l'image</label>
        <div style="display:flex;gap:8px;margin-top:2px">
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:var(--text)">
            <input type="radio" name="img-bg" id="img-bg-transparent" value="transparent" checked style="accent-color:var(--accent)">
            Transparent
          </label>
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:var(--text)">
            <input type="radio" name="img-bg" id="img-bg-white" value="white" style="accent-color:var(--accent)">
            Blanc opaque
          </label>
        </div>
      </div>
      <button class="add-btn" id="btn-add-img" onclick="addImage()" disabled>+ Ajouter image</button>
      <div id="img-preview-wrap" style="margin-top:8px; display:none">
        <img id="img-preview" style="width:100%; border-radius:6px; border:1px solid var(--border); max-height:80px; object-fit:contain">
      </div>
    </div>

    <!-- Cases à cocher -->
    <div class="tool-section">
      <h3>Case à cocher</h3>
      <div class="form-row">
        <label>Taille (px)</label>
        <input type="number" id="cb-size" value="18" min="10" max="60" style="width:80px">
      </div>
      <div class="form-row">
        <label>Style</label>
        <select id="cb-style">
          <option value="check">✓ Coche</option>
          <option value="cross">✗ Croix</option>
          <option value="dot">● Point</option>
          <option value="empty">☐ Vide</option>
        </select>
      </div>
      <div class="form-row">
        <label>Couleur</label>
        <input type="color" id="cb-color" value="#000000">
      </div>
      <button class="add-btn" id="btn-add-cb" onclick="addCheckbox()" disabled>+ Ajouter case</button>
    </div>

    <!-- Éléments sur la page -->
    <div class="tool-section" id="elements-panel">
      <h3>Éléments (<span id="el-count">0</span>)</h3>
      <div id="elements-list" style="font-size:12px; color:var(--muted);">
        <em>Aucun élément ajouté</em>
      </div>
    </div>

  </div>

  <!-- Canvas area -->
  <div id="canvas-area">
    <div id="editor-container">
      <canvas id="pdf-canvas"></canvas>
      <div id="overlay">
        <!-- elements go here -->
      </div>
      <div id="empty-state">
        <div class="big-icon">📄</div>
        <p>Ouvrez un fichier PDF<br>pour commencer à l'éditer</p>
        <button class="topbtn" onclick="document.getElementById('file-input').click()" style="pointer-events:all; margin-top:8px">
          📂 Ouvrir un PDF
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Status bar -->
<div id="statusbar">
  <span id="status-file">📄 Aucun fichier ouvert</span>
  <span id="status-size"></span>
  <span id="status-sel"></span>
</div>

<!-- Drop zone -->
<div id="drop-zone">📂 Déposez votre PDF ici</div>

<!-- Zoom modal (simple) -->
<div class="modal-backdrop" id="zoom-modal">
  <div class="modal">
    <h2>🔍 Niveau de zoom</h2>
    <div class="form-row">
      <label>Zoom (%)</label>
      <input type="range" id="zoom-range" min="25" max="300" value="100" style="width:100%">
      <div style="text-align:center; margin-top:6px; font-size:14px"><span id="zoom-val">100</span>%</div>
    </div>
    <div class="modal-btns">
      <button class="topbtn" onclick="closeZoomModal()">Annuler</button>
      <button class="topbtn primary" onclick="applyZoom()">Appliquer</button>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ========== STATE ==========
let pdfDoc = null;
let pdfBytes = null;
let currentPage = 1;
let totalPages = 0;
let scale = 1.5;
let zoom = 1.0;
let elements = {}; // { pageNum: [ {id, type, x, y, w, h, ...data} ] }
let selectedId = null;
let undoStack = [];
let imgDataURL = null;
let imgFileName = '';

// ========== PDF LOAD ==========
document.getElementById('file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const ab = await file.arrayBuffer();
  pdfBytes = new Uint8Array(ab);
  await loadPDF(pdfBytes, file.name);
  e.target.value = '';
});

async function loadPDF(bytes, name) {
  try {
    pdfDoc = await pdfjsLib.getDocument({data: bytes.slice()}).promise;
    totalPages = pdfDoc.numPages;
    currentPage = 1;
    elements = {};
    selectedId = null;
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('page-nav').style.display = 'flex';
    document.getElementById('save-btn').disabled = false;
    document.getElementById('btn-add-text').disabled = false;
    document.getElementById('btn-add-img').disabled = false;
    document.getElementById('btn-add-cb').disabled = false;
    document.getElementById('status-file').textContent = '📄 ' + name;
    document.getElementById('total-pages').textContent = totalPages;
    await renderPage();
    updateElementsList();
  } catch(err) {
    alert('Erreur lors du chargement du PDF: ' + err.message);
  }
}

async function renderPage() {
  const page = await pdfDoc.getPage(currentPage);
  const viewport = page.getViewport({scale: scale * zoom});
  const canvas = document.getElementById('pdf-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  document.getElementById('overlay').style.width = viewport.width + 'px';
  document.getElementById('overlay').style.height = viewport.height + 'px';
  document.getElementById('status-size').textContent =
    `📐 ${Math.round(viewport.width)}×${Math.round(viewport.height)}px`;
  await page.render({canvasContext: ctx, viewport}).promise;
  document.getElementById('cur-page').textContent = currentPage;
  renderElements();
  updatePageNav();
}

function changePage(dir) {
  const np = currentPage + dir;
  if (np < 1 || np > totalPages) return;
  currentPage = np;
  renderPage();
  updateElementsList();
}

function updatePageNav() {
  document.getElementById('prev-page').disabled = currentPage <= 1;
  document.getElementById('next-page').disabled = currentPage >= totalPages;
}

// ========== ELEMENTS ==========
function getPageElements() {
  if (!elements[currentPage]) elements[currentPage] = [];
  return elements[currentPage];
}

function addText() {
  const content = document.getElementById('txt-content').value.trim();
  if (!content) { alert('Entrez du texte.'); return; }
  const size = parseInt(document.getElementById('txt-size').value) || 16;
  const color = document.getElementById('txt-color').value;
  const font = document.getElementById('txt-font').value;
  const bold = document.getElementById('txt-bold').checked;
  const italic = document.getElementById('txt-italic').checked;
  const bg = document.querySelector('input[name="txt-bg"]:checked').value;

  saveUndo();
  const id = 'el-' + Date.now();
  const canvas = document.getElementById('pdf-canvas');
  getPageElements().push({
    id, type: 'text',
    x: 50, y: 50,
    w: Math.min(300, canvas.width - 60),
    h: size * 2 + 16,
    content, size, color, font, bold, italic, bg
  });
  renderElements();
  selectElement(id);
  updateElementsList();
}

function addCheckbox() {
  const size = parseInt(document.getElementById('cb-size').value) || 18;
  const style = document.getElementById('cb-style').value;
  const color = document.getElementById('cb-color').value;
  saveUndo();
  const id = 'el-' + Date.now();
  getPageElements().push({
    id, type: 'checkbox',
    x: 60, y: 60,
    w: size + 4, h: size + 4,
    size, style, color, checked: style !== 'empty'
  });
  renderElements();
  selectElement(id);
  updateElementsList();
}

function addImage() {
  if (!imgDataURL) { alert('Choisissez d\'abord une image.'); return; }
  saveUndo();
  const id = 'el-' + Date.now();
  const canvas = document.getElementById('pdf-canvas');
  const w = Math.min(200, canvas.width - 60);
  const bg = document.querySelector('input[name="img-bg"]:checked').value;
  getPageElements().push({
    id, type: 'image',
    x: 50, y: 50,
    w, h: w,
    src: imgDataURL, bg
  });
  renderElements();
  selectElement(id);
  updateElementsList();
}

function deleteElement(id) {
  saveUndo();
  elements[currentPage] = (elements[currentPage] || []).filter(e => e.id !== id);
  if (selectedId === id) selectedId = null;
  renderElements();
  updateElementsList();
  document.getElementById('status-sel').textContent = '';
}

// ========== RENDER ELEMENTS ==========
function renderElements() {
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = '';
  const els = getPageElements();
  els.forEach(el => {
    const div = document.createElement('div');
    div.className = 'el' + (el.id === selectedId ? ' selected' : '');
    div.id = el.id;
    div.style.left = el.x + 'px';
    div.style.top = el.y + 'px';
    div.style.width = el.w + 'px';
    div.style.height = el.h + 'px';

    // Border
    const border = document.createElement('div');
    border.className = 'el-border';
    div.appendChild(border);

    // Content
    if (el.type === 'text') {
      const inner = document.createElement('div');
      inner.className = 'el-text-inner';
      inner.style.fontSize = el.size + 'px';
      inner.style.color = el.color;
      inner.style.fontFamily = el.font;
      inner.style.fontWeight = el.bold ? '700' : '400';
      inner.style.fontStyle = el.italic ? 'italic' : 'normal';
      inner.style.backgroundColor = (el.bg === 'white') ? 'white' : 'transparent';
      inner.style.padding = (el.bg === 'white') ? '3px 5px' : '0';
      inner.textContent = el.content;
      div.appendChild(inner);
    } else if (el.type === 'image') {
      if (el.bg === 'white') {
        div.style.backgroundColor = 'white';
      }
      const img = document.createElement('img');
      img.className = 'el-img-inner';
      img.src = el.src;
      div.appendChild(img);
    } else if (el.type === 'checkbox') {
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('width', el.w);
      svg.setAttribute('height', el.h);
      svg.style.display = 'block';
      const s = el.size;
      // border rect
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x','2'); rect.setAttribute('y','2');
      rect.setAttribute('width', s); rect.setAttribute('height', s);
      rect.setAttribute('rx','2');
      rect.setAttribute('fill','white');
      rect.setAttribute('stroke', el.color);
      rect.setAttribute('stroke-width','2');
      svg.appendChild(rect);
      // mark inside
      if (el.style === 'check') {
        const path = document.createElementNS('http://www.w3.org/2000/svg','polyline');
        path.setAttribute('points', `${4+s*0.15},${2+s*0.5} ${2+s*0.4},${2+s*0.75} ${2+s*0.85},${2+s*0.25}`);
        path.setAttribute('fill','none');
        path.setAttribute('stroke', el.color);
        path.setAttribute('stroke-width','2.5');
        path.setAttribute('stroke-linecap','round');
        svg.appendChild(path);
      } else if (el.style === 'cross') {
        ['M '+(4+s*0.15)+','+(2+s*0.15)+' L '+(2+s*0.85)+','+(2+s*0.85),
         'M '+(2+s*0.85)+','+(2+s*0.15)+' L '+(4+s*0.15)+','+(2+s*0.85)].forEach(d=>{
          const p = document.createElementNS('http://www.w3.org/2000/svg','path');
          p.setAttribute('d',d); p.setAttribute('stroke',el.color);
          p.setAttribute('stroke-width','2.5'); p.setAttribute('stroke-linecap','round');
          svg.appendChild(p);
        });
      } else if (el.style === 'dot') {
        const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('cx', 2+s/2); c.setAttribute('cy', 2+s/2);
        c.setAttribute('r', s*0.28);
        c.setAttribute('fill', el.color);
        svg.appendChild(c);
      }
      div.appendChild(svg);
      // Toggle on double-click
      div.addEventListener('dblclick', e2 => {
        e2.stopPropagation();
        const found = (elements[currentPage]||[]).find(x=>x.id===el.id);
        if (found) {
          found.checked = !found.checked;
          found.style = found.checked ? (found._baseStyle || 'check') : 'empty';
        }
        renderElements();
      });
    }

    // Handles
    ['nw','n','ne','w','e','sw','s','se'].forEach(pos => {
      const h = document.createElement('div');
      h.className = 'handle ' + pos;
      h.dataset.handle = pos;
      div.appendChild(h);
    });

    // Delete button
    const del = document.createElement('button');
    del.className = 'el-del';
    del.textContent = '×';
    del.onclick = (e) => { e.stopPropagation(); deleteElement(el.id); };
    div.appendChild(del);

    // Events
    div.addEventListener('mousedown', e => onElMousedown(e, el));
    div.addEventListener('touchstart', e => onElTouchstart(e, el), {passive: false});

    overlay.appendChild(div);
  });

  // Click outside to deselect
  overlay.addEventListener('mousedown', e => {
    if (e.target === overlay) deselectAll();
  });
}

function selectElement(id) {
  selectedId = id;
  renderElements();
  const el = getPageElements().find(e => e.id === id);
  if (el) {
    document.getElementById('status-sel').textContent =
      el.type === 'text' ? `✏️ Texte sélectionné` : `🖼️ Image sélectionnée`;
  }
}

function deselectAll() {
  selectedId = null;
  renderElements();
  document.getElementById('status-sel').textContent = '';
}

// ========== DRAG & RESIZE ==========
let dragState = null;

function onElMousedown(e, el) {
  if (e.target.classList.contains('el-del')) return;
  e.preventDefault();
  e.stopPropagation();
  selectElement(el.id);

  const handle = e.target.dataset.handle;
  dragState = {
    id: el.id, handle,
    startX: e.clientX, startY: e.clientY,
    origX: el.x, origY: el.y,
    origW: el.w, origH: el.h
  };

  window.addEventListener('mousemove', onMousemove);
  window.addEventListener('mouseup', onMouseup);
}

function onElTouchstart(e, el) {
  if (e.target.classList.contains('el-del')) return;
  e.preventDefault();
  e.stopPropagation();
  selectElement(el.id);
  const t = e.touches[0];
  const handle = e.target.dataset.handle;
  dragState = {
    id: el.id, handle,
    startX: t.clientX, startY: t.clientY,
    origX: el.x, origY: el.y,
    origW: el.w, origH: el.h
  };
  window.addEventListener('touchmove', onTouchmove, {passive: false});
  window.addEventListener('touchend', onTouchend);
}

function applyDrag(clientX, clientY) {
  if (!dragState) return;
  const dx = clientX - dragState.startX;
  const dy = clientY - dragState.startY;
  const el = (elements[currentPage] || []).find(e => e.id === dragState.id);
  if (!el) return;

  const h = dragState.handle;
  const canvas = document.getElementById('pdf-canvas');

  if (!h) {
    // Move
    el.x = Math.max(0, Math.min(canvas.width - el.w, dragState.origX + dx));
    el.y = Math.max(0, Math.min(canvas.height - el.h, dragState.origY + dy));
  } else {
    // Resize
    let nx = dragState.origX, ny = dragState.origY;
    let nw = dragState.origW, nh = dragState.origH;
    const minW = 30, minH = 20;

    if (h.includes('e')) nw = Math.max(minW, dragState.origW + dx);
    if (h.includes('s')) nh = Math.max(minH, dragState.origH + dy);
    if (h.includes('w')) {
      nw = Math.max(minW, dragState.origW - dx);
      nx = dragState.origX + dragState.origW - nw;
    }
    if (h.includes('n')) {
      nh = Math.max(minH, dragState.origH - dy);
      ny = dragState.origY + dragState.origH - nh;
    }
    el.x = nx; el.y = ny; el.w = nw; el.h = nh;
  }

  renderElements();
}

function onMousemove(e) { applyDrag(e.clientX, e.clientY); }
function onTouchmove(e) { e.preventDefault(); applyDrag(e.touches[0].clientX, e.touches[0].clientY); }

function onMouseup() {
  if (dragState) saveUndo();
  dragState = null;
  window.removeEventListener('mousemove', onMousemove);
  window.removeEventListener('mouseup', onMouseup);
}
function onTouchend() {
  if (dragState) saveUndo();
  dragState = null;
  window.removeEventListener('touchmove', onTouchmove);
  window.removeEventListener('touchend', onTouchend);
}

// ========== ELEMENTS LIST (sidebar) ==========
function updateElementsList() {
  const els = getPageElements();
  document.getElementById('el-count').textContent = els.length;
  const list = document.getElementById('elements-list');
  if (els.length === 0) {
    list.innerHTML = '<em>Aucun élément ajouté</em>';
    return;
  }
  list.innerHTML = els.map((el, i) => `
    <div style="display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--border)">
      <span>${el.type === 'text' ? '✏️' : el.type === 'checkbox' ? '☑️' : '🖼️'}</span>
      <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">
        ${el.type === 'text' ? el.content.substring(0,20) + (el.content.length>20?'…':'') : el.type === 'checkbox' ? 'Case ('+el.style+')' : 'Image'}
      </span>
      <button onclick="deleteElement('${el.id}')" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;padding:0 2px" title="Supprimer">×</button>
    </div>
  `).join('');
}

// ========== IMAGE INPUT ==========
document.getElementById('img-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  imgFileName = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    imgDataURL = ev.target.result;
    const prev = document.getElementById('img-preview');
    prev.src = imgDataURL;
    document.getElementById('img-preview-wrap').style.display = 'block';
    if (!document.getElementById('save-btn').disabled) {
      document.getElementById('btn-add-img').disabled = false;
    }
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

// ========== UNDO ==========
function saveUndo() {
  undoStack.push(JSON.stringify(elements));
  if (undoStack.length > 30) undoStack.shift();
  document.getElementById('undo-btn').disabled = false;
}

function undo() {
  if (!undoStack.length) return;
  elements = JSON.parse(undoStack.pop());
  if (!undoStack.length) document.getElementById('undo-btn').disabled = true;
  renderElements();
  updateElementsList();
  selectedId = null;
}

// ========== ZOOM ==========
function openZoomModal() {
  const pct = Math.round(zoom * 100);
  document.getElementById('zoom-range').value = pct;
  document.getElementById('zoom-val').textContent = pct;
  document.getElementById('zoom-modal').classList.add('open');
}
function closeZoomModal() {
  document.getElementById('zoom-modal').classList.remove('open');
}
document.getElementById('zoom-range').addEventListener('input', e => {
  document.getElementById('zoom-val').textContent = e.target.value;
});
function applyZoom() {
  zoom = parseInt(document.getElementById('zoom-range').value) / 100;
  document.getElementById('zoom-label').textContent = Math.round(zoom*100) + '%';
  closeZoomModal();
  if (pdfDoc) renderPage();
}

// ========== DRAG & DROP PDF ==========
document.body.addEventListener('dragover', e => {
  e.preventDefault();
  document.getElementById('drop-zone').classList.add('active');
});
document.body.addEventListener('dragleave', e => {
  if (!e.relatedTarget) document.getElementById('drop-zone').classList.remove('active');
});
document.body.addEventListener('drop', async e => {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (!file || !file.name.endsWith('.pdf')) { alert('Déposez un fichier PDF.'); return; }
  const ab = await file.arrayBuffer();
  pdfBytes = new Uint8Array(ab);
  await loadPDF(pdfBytes, file.name);
});

// ========== EXPORT PDF ==========
async function exportPDF() {
  if (!pdfBytes) return;

  try {
    const { PDFDocument, rgb, StandardFonts } = PDFLib;

    // Load original
    const pdfDocLib = await PDFDocument.load(pdfBytes, {ignoreEncryption: true});

    // Embed Helvetica for text
    const helvetica = await pdfDocLib.embedFont(StandardFonts.Helvetica);
    const helveticaBoldItalic = await pdfDocLib.embedFont(StandardFonts.HelveticaBoldOblique);
    const helveticaBold = await pdfDocLib.embedFont(StandardFonts.HelveticaBold);
    const helveticaItalic = await pdfDocLib.embedFont(StandardFonts.HelveticaOblique);

    // For each page with elements
    for (const [pageNumStr, els] of Object.entries(elements)) {
      const pageNum = parseInt(pageNumStr);
      if (!els || els.length === 0) continue;

      const page = pdfDocLib.getPage(pageNum - 1);
      const { width: pdfW, height: pdfH } = page.getSize();

      // Get canvas dimensions for this page
      const pdfJsPage = await pdfDoc.getPage(pageNum);
      const viewport = pdfJsPage.getViewport({scale: scale * zoom});
      const canvasW = viewport.width;
      const canvasH = viewport.height;

      // Scale factors
      const scaleX = pdfW / canvasW;
      const scaleY = pdfH / canvasH;

      for (const el of els) {
        if (el.type === 'text') {
          // Convert canvas coords → PDF coords (PDF origin = bottom-left)
          const pdfX = el.x * scaleX;
          const pdfY = pdfH - (el.y + el.h) * scaleY;
          const fontSize = el.size * Math.min(scaleX, scaleY);

          // White background rectangle if needed
          if (el.bg === 'white') {
            page.drawRectangle({
              x: pdfX, y: pdfY,
              width: el.w * scaleX, height: el.h * scaleY,
              color: rgb(1, 1, 1),
              borderWidth: 0,
            });
          }

          // Parse color
          const hex = el.color.replace('#','');
          const r = parseInt(hex.slice(0,2),16)/255;
          const g = parseInt(hex.slice(2,4),16)/255;
          const b = parseInt(hex.slice(4,6),16)/255;

          // Choose font
          let font = helvetica;
          if (el.bold && el.italic) font = helveticaBoldItalic;
          else if (el.bold) font = helveticaBold;
          else if (el.italic) font = helveticaItalic;

          // Draw text line by line
          const lines = wrapText(el.content, el.w * scaleX, font, fontSize);
          const lineH = fontSize * 1.4;
          lines.forEach((line, li) => {
            const yPos = pdfY + (lines.length - 1 - li) * lineH;
            page.drawText(line, {
              x: pdfX,
              y: yPos,
              size: fontSize,
              font,
              color: rgb(r, g, b),
              maxWidth: el.w * scaleX,
            });
          });

        } else if (el.type === 'checkbox') {
          const pdfX = el.x * scaleX;
          const pdfY = pdfH - (el.y + el.h) * scaleY;
          const sz = el.size * Math.min(scaleX, scaleY);
          const hex = el.color.replace('#','');
          const cr = parseInt(hex.slice(0,2),16)/255;
          const cg = parseInt(hex.slice(2,4),16)/255;
          const cb2 = parseInt(hex.slice(4,6),16)/255;
          const col = rgb(cr,cg,cb2);
          // Draw border square
          page.drawRectangle({x:pdfX, y:pdfY, width:sz, height:sz,
            borderColor:col, borderWidth:1.5, color:rgb(1,1,1)});
          // Draw mark
          if (el.style === 'check') {
            page.drawLine({start:{x:pdfX+sz*0.15,y:pdfY+sz*0.45},end:{x:pdfX+sz*0.4,y:pdfY+sz*0.2},color:col,thickness:1.5});
            page.drawLine({start:{x:pdfX+sz*0.4,y:pdfY+sz*0.2},end:{x:pdfX+sz*0.85,y:pdfY+sz*0.75},color:col,thickness:1.5});
          } else if (el.style === 'cross') {
            page.drawLine({start:{x:pdfX+sz*0.15,y:pdfY+sz*0.85},end:{x:pdfX+sz*0.85,y:pdfY+sz*0.15},color:col,thickness:1.5});
            page.drawLine({start:{x:pdfX+sz*0.85,y:pdfY+sz*0.85},end:{x:pdfX+sz*0.15,y:pdfY+sz*0.15},color:col,thickness:1.5});
          } else if (el.style === 'dot') {
            page.drawEllipse({x:pdfX+sz/2,y:pdfY+sz/2,xScale:sz*0.28,yScale:sz*0.28,color:col});
          }
        } else if (el.type === 'image') {
          // Embed image
          let embeddedImg;
          try {
            if (el.src.includes('image/png') || el.src.includes('image/PNG')) {
              const imgBytes = dataURLtoBytes(el.src);
              embeddedImg = await pdfDocLib.embedPng(imgBytes);
            } else {
              const imgBytes = dataURLtoBytes(el.src);
              embeddedImg = await pdfDocLib.embedJpg(imgBytes);
            }
            const pdfX = el.x * scaleX;
            const pdfY = pdfH - (el.y + el.h) * scaleY;
            const pdfW2 = el.w * scaleX;
            const pdfH2 = el.h * scaleY;
            // White background rectangle if needed
            if (el.bg === 'white') {
              page.drawRectangle({
                x: pdfX, y: pdfY,
                width: pdfW2, height: pdfH2,
                color: rgb(1, 1, 1),
                borderWidth: 0,
              });
            }
            page.drawImage(embeddedImg, {
              x: pdfX,
              y: pdfY,
              width: pdfW2,
              height: pdfH2,
            });
          } catch(imgErr) {
            console.warn('Image embed error:', imgErr);
          }
        }
      }
    }

    const outBytes = await pdfDocLib.save();
    const blob = new Blob([outBytes], {type: 'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'document-modifie.pdf';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);

  } catch(err) {
    alert('Erreur lors de l\'export PDF: ' + err.message);
    console.error(err);
  }
}

function dataURLtoBytes(dataURL) {
  const base64 = dataURL.split(',')[1];
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function wrapText(text, maxWidth, font, size) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    try {
      const tw = font.widthOfTextAtSize(test, size);
      if (tw > maxWidth && line) { lines.push(line); line = word; }
      else line = test;
    } catch { line = test; }
  }
  if (line) lines.push(line);
  // Also split on \n
  const result = [];
  for (const l of lines) {
    l.split('\n').forEach(s => result.push(s));
  }
  return result;
}

// ========== KEYBOARD ==========
document.addEventListener('keydown', e => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (selectedId) { deleteElement(selectedId); }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
});
